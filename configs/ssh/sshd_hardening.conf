# /etc/ssh/sshd_config.d/10-mediconnect.conf
# Key-only SSH, one named account, no root, no forwarding.
# Replace adm-eytan with your own admin account.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers adm-eytan
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
