# nginx on the demo host: isolated copy of the portal, fictitious data.
ssl_certificate     /etc/nginx/tls/demo.crt;
ssl_certificate_key /etc/nginx/tls/demo.key;

server {
    listen 443 ssl default_server;
    server_name demo.mediconnect.lab 10.10.40.10;
    root /var/www/demo;
    index index.html;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /whoami { default_type text/plain; return 200 "$remote_addr\n"; }
    location / { try_files $uri $uri/ =404; }
}
