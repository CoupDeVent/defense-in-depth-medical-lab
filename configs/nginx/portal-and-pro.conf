# nginx on the DMZ host: public portal + authenticated doctor area

# ---------- Global settings ----------
server_tokens off;
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

ssl_certificate     /etc/nginx/tls/portail.crt;
ssl_certificate_key /etc/nginx/tls/portail.key;
ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache   shared:SSL:5m;
ssl_session_tickets off;

# ---------- Port 80: redirection only ----------
server { listen 80; server_name portail.mediconnect.lab;
         return 301 https://portail.mediconnect.lab$request_uri; }
server { listen 80; server_name pro.mediconnect.lab;
         return 301 https://pro.mediconnect.lab$request_uri; }
server { listen 80 default_server; server_name _; return 444; }

# ---------- 443 default site: reject ----------
server { listen 443 ssl default_server; server_name _; ssl_reject_handshake on; }

# ---------- Public portal (patients) ----------
server {
    listen 443 ssl;
    server_name portail.mediconnect.lab;
    root /var/www/portail;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    limit_req zone=perip burst=20 nodelay;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 400 403 404 405 500 502 503 504 /err.html;
    location = /err.html { internal; }
    location / { try_files $uri $uri/ =404; }
}

# ---------- Doctor area: mutual TLS + password ----------
server {
    listen 443 ssl;
    server_name pro.mediconnect.lab;
    root /var/www/pro;
    index index.html;

    ssl_client_certificate /etc/nginx/tls/mediconnect-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;

    auth_basic "Espace professionnel";
    auth_basic_user_file /etc/nginx/.htpasswd-pro;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    limit_req zone=perip burst=20 nodelay;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 400 403 404 405 500 502 503 504 /err.html;
    location = /err.html { internal; }

    location = /whoami {
        default_type text/plain;
        return 200 "Certificat : $ssl_client_s_dn\nVerification : $ssl_client_verify\n";
    }
    location / { try_files $uri $uri/ =404; }
}
